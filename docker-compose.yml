services:
  postgres:
    image: postgres:16-alpine
    container_name: bitly-postgres
    environment:
      POSTGRES_DB: bitly
      POSTGRES_USER: bitly
      POSTGRES_PASSWORD: bitly_dev_only
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bitly -d bitly"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bitly-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  write-api:
    build:
      context: .
      dockerfile: src/Bitly.WriteApi/Dockerfile
    container_name: bitly-write-api
    environment:
      ConnectionStrings__BitlyDb: "Host=postgres;Port=5432;Database=bitly;Username=bitly;Password=bitly_dev_only"
      ConnectionStrings__Redis: "redis:6379"
      PublicBaseUrl: "http://localhost:8080"
    ports:
      - "5299:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  read-api-1:
    build:
      context: .
      dockerfile: src/Bitly.ReadApi/Dockerfile
    container_name: bitly-read-api-1
    environment:
      ConnectionStrings__BitlyDb: "Host=postgres;Port=5432;Database=bitly;Username=bitly;Password=bitly_dev_only"
      ConnectionStrings__Redis: "redis:6379"
      INSTANCE_NAME: "read-a"
    ports:
      - "5300:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  read-api-2:
    build:
      context: .
      dockerfile: src/Bitly.ReadApi/Dockerfile
    container_name: bitly-read-api-2
    environment:
      ConnectionStrings__BitlyDb: "Host=postgres;Port=5432;Database=bitly;Username=bitly;Password=bitly_dev_only"
      ConnectionStrings__Redis: "redis:6379"
      INSTANCE_NAME: "read-b"
    ports:
      - "5301:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  nginx:
    image: nginx:alpine
    container_name: bitly-lb
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      write-api:
        condition: service_healthy
      read-api-1:
        condition: service_healthy
      read-api-2:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
