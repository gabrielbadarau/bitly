services:
  postgres:
    image: postgres:16-alpine
    container_name: bitly-postgres
    environment:
      POSTGRES_DB: bitly
      POSTGRES_USER: bitly
      POSTGRES_PASSWORD: bitly_dev_only
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bitly -d bitly"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
